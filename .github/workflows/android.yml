# 編譯 PhoneAI Overlay 的 APK（使用者沒有電腦，靠這個在雲端編譯），並在 main 上自動發布成 GitHub Release。
# 下載：GitHub 頁面右側「Releases」最新一筆的 PhoneAI.apk（App 內「檢查並更新」也是抓這個，不需要權杖）。
# 簽名：用 Secrets 裡的金鑰（KEYSTORE_BASE64、KEYSTORE_PASSWORD、KEY_ALIAS、KEY_PASSWORD），簽名固定才能覆蓋安裝。
# 還沒設 Secrets 時只上傳 Artifact（臨時簽名，不發布 Release）；產生金鑰與設定步驟見 docs/PUBLISH_CHECKLIST.md。
name: Android APK

on:
  push:
    branches:
      - main  # 只在 main 編譯；工作分支推送不再重複編譯
    paths:
      - "android-overlay/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

# 權限：整個 workflow 預設只讀；只有「發布」那個 job 才有寫入權限（建置 job 會跑 Gradle 與第三方程式，不給它能改 repo 或發 Release 的權杖）。
# 簽名金鑰：單元測試之後才還原金鑰檔，密碼只在「Build release APK」那一個步驟的環境變數裡，不寫進 GITHUB_ENV；金鑰檔建置完立刻刪掉。
# 第三方 Actions 都固定到完整 commit SHA（註解寫對應的版本標籤），避免標籤被改指到惡意程式。
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # 要用完整歷史產生「這次更新了什麼」
          persist-credentials: false   # 建置用不到 git 憑證，不要留在 .git/config 裡
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.14.3"
      # 離線語音辨識（sherpa-onnx）的原生函式庫：官方發布檔，約 27MB，不放進 repo；固定版本並核對 SHA-256，檔案被換掉就中止編譯
      - name: Download sherpa-onnx native libs (arm64)
        run: |
          set -euo pipefail
          VER=1.13.8
          SHA=2ff63469a71cb6009aa2e3ed5f4a670f8abdcbe4bb9ffd23776afc792a6b4f44
          curl -fsSL --retry 3 -o /tmp/sherpa-android.tar.bz2 "https://github.com/k2-fsa/sherpa-onnx/releases/download/v${VER}/sherpa-onnx-v${VER}-android.tar.bz2"
          echo "${SHA}  /tmp/sherpa-android.tar.bz2" | sha256sum -c -
          mkdir -p /tmp/sherpa-x android-overlay/app/src/main/jniLibs/arm64-v8a
          tar xjf /tmp/sherpa-android.tar.bz2 -C /tmp/sherpa-x ./jniLibs/arm64-v8a/libonnxruntime.so ./jniLibs/arm64-v8a/libsherpa-onnx-jni.so
          cp /tmp/sherpa-x/jniLibs/arm64-v8a/libonnxruntime.so /tmp/sherpa-x/jniLibs/arm64-v8a/libsherpa-onnx-jni.so android-overlay/app/src/main/jniLibs/arm64-v8a/
          ls -l android-overlay/app/src/main/jniLibs/arm64-v8a/
      - name: Unit tests
        working-directory: android-overlay
        run: gradle --no-daemon testDebugUnitTest
      - name: Restore signing key (from Secrets)
        id: signing
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KS_ALIAS" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            chmod 600 "$RUNNER_TEMP/release.jks"
            echo "ks_file=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::沒有設定簽名金鑰 Secrets：這次用臨時金鑰簽名，不會發布 Release（見 docs/PUBLISH_CHECKLIST.md）"
            echo "ks_file=" >> "$GITHUB_OUTPUT"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      # main 上沒有簽名金鑰就直接失敗：否則會產生「每次簽名都不同」的 APK，手機上每次更新都得先解除安裝
      - name: Require signing key on main
        if: github.ref == 'refs/heads/main' && steps.signing.outputs.signed != 'true'
        run: |
          echo "::error::main 上需要簽名金鑰：請照 docs/PUBLISH_CHECKLIST.md「簽名金鑰」設定 4 個 Secrets 後重跑"
          exit 1
      - name: Build release APK
        working-directory: android-overlay
        env:   # 簽名金鑰只在這一步可見
          KEYSTORE_FILE: ${{ steps.signing.outputs.ks_file }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease -PgitSha=${GITHUB_SHA::7}
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/PhoneAI.apk
      - name: Remove signing key file
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - name: Verify APK signature
        run: |
          set -euo pipefail
          APK=android-overlay/app/build/outputs/apk/release/PhoneAI.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | grep -E "Verifies|SHA-256 digest|Number of signers" || true
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK"   # 簽名無效就讓這一步失敗
          sha256sum "$APK"
      - name: Write SHA256SUMS.txt
        run: |
          set -euo pipefail
          cd android-overlay/app/build/outputs/apk/release
          sha256sum PhoneAI.apk > SHA256SUMS.txt   # 檔名用相對的：使用者下載到同一個資料夾就能 sha256sum -c 核對
          sha256sum -c SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phoneai-overlay-apk
          path: |
            android-overlay/app/build/outputs/apk/release/PhoneAI.apk
            android-overlay/app/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.outputs.signed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 建立 Release、把整理好的 CHANGELOG 推回 main；只有這個 job 有寫入權限
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: phoneai-overlay-apk
          path: apk
      - name: Verify artifact checksum
        run: |
          set -euo pipefail
          cd apk
          ls -l
          sha256sum -c SHA256SUMS.txt   # 兩個 job 之間檔案被換掉或損壞就中止，不發布
      # 發布 Release：App 與 update_app.py 都從「最新的 Release」下載，不需要權杖。只在 main 上、且有簽名金鑰時發布。
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHORT=${GITHUB_SHA::7}
          TAG="build-$((GITHUB_RUN_NUMBER + 1000))-${SHORT}"   # 與 versionCode 相同（+1000），App 的更新檢查用這個數字比新舊
          # 更新說明：上一個 Release 之後的提交訊息（沒有上一個就列最近 15 筆）
          PREV_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)
          PREV_SHA=""
          if [ -n "$PREV_TAG" ]; then PREV_SHA=$(echo "$PREV_TAG" | awk -F- '{print $NF}'); fi
          {
            echo "commit: ${GITHUB_SHA}"
            echo
            # 優先用 CHANGELOG.md 的 Unreleased（中文｜English 雙語）；沒有才退回 commit 標題
            CL=$(git show "${GITHUB_SHA}:CHANGELOG.md" 2>/dev/null | awk '/^## Unreleased/{f=1;next} /^## /{f=0} f' | grep -v -e '電腦版' -e 'Windows app' -e 'Windows 版' | sed '/^[[:space:]]*$/d' || true)
            echo "## 這次更新了什麼｜What's new"
            if [ -n "$CL" ]; then
              echo "$CL"
            else
              # 沒有新的使用者可見改動：不退回 commit 標題（那是中文），只用雙語的固定說明
              echo "- 小修正與內部改進｜Minor fixes and internal improvements"
            fi
            echo
            echo "自動編譯的 APK（用專案固定金鑰簽名，可直接覆蓋安裝）｜Automatically built APK, signed with the project's fixed key; it installs over the previous version."
            echo
            echo "校驗碼｜Checksum（SHA-256）：\`sha256sum -c SHA256SUMS.txt\`"
            sed 's/^/    /' apk/SHA256SUMS.txt
          } > "$RUNNER_TEMP/notes.md"
          # 增量更新補丁：上一版 → 這一版（App 只下載補丁，拼出新 APK 後用 SHA256SUMS.txt 核對；補丁不比完整 APK 小很多就不放）
          EXTRA=()
          if [ -n "$PREV_TAG" ]; then
            PREV_CODE=$(echo "$PREV_TAG" | awk -F- '{print $2}')
            if gh release download "$PREV_TAG" --pattern PhoneAI.apk --dir "$RUNNER_TEMP/prev" 2>/dev/null \
               && python3 -m pip install --quiet bsdiff4 \
               && python3 android-overlay/tools/make_delta.py "$RUNNER_TEMP/prev/PhoneAI.apk" apk/PhoneAI.apk "apk/PhoneAI-from-${PREV_CODE}.patch"; then
              FULL=$(stat -c %s apk/PhoneAI.apk); PSZ=$(stat -c %s "apk/PhoneAI-from-${PREV_CODE}.patch")
              echo "補丁 ${PSZ} 位元組，完整 APK ${FULL} 位元組"
              if [ $((PSZ * 10)) -lt $((FULL * 7)) ]; then EXTRA=("apk/PhoneAI-from-${PREV_CODE}.patch"); fi
            else
              echo "沒做出補丁（略過）：App 會下載完整 APK"
            fi
          fi
          gh release create "$TAG" apk/PhoneAI.apk apk/SHA256SUMS.txt "${EXTRA[@]}" \
            --target "$GITHUB_SHA" --title "PhoneAI ${SHORT}" --latest \
            --notes-file "$RUNNER_TEMP/notes.md"
          # 只留最近 10 個 Release，舊的連同 tag 刪掉
          gh release list --limit 100 --json tagName --jq '.[10:][].tagName' | while read -r old; do
            [ -n "$old" ] && gh release delete "$old" --cleanup-tag --yes || true
          done
      # 把已發布的 Unreleased 移到版本標題底下，下一版只列新改動（commit 回 main，[skip ci] 不會再觸發編譯）
      - name: Archive released changelog
        run: |
          set -euo pipefail
          V="1.0.$((GITHUB_RUN_NUMBER + 1000))"
          python3 - "$V" <<'PY'
          import re, sys
          v = sys.argv[1]
          p = 'CHANGELOG.md'
          s = open(p, encoding='utf-8').read()
          m = re.search(r'^## Unreleased\n(.*?)(?=^## |\Z)', s, re.S | re.M)
          if not m or not m.group(1).strip():
              sys.exit(0)
          body = m.group(1).strip() + "\n\n"
          s = s[:m.start()] + "## Unreleased\n\n## " + v + "\n\n" + body + s[m.end():]
          open(p, 'w', encoding='utf-8').write(s)
          PY
          if ! git diff --quiet -- CHANGELOG.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add CHANGELOG.md
            git commit -m "Archive changelog for $V [skip ci]"
            git push origin HEAD:main || echo "push failed; archive CHANGELOG.md by hand"
          fi
