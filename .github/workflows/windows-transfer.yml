name: Windows transfer

on:
  push:
    branches: [main]
    paths: ["windows-transfer/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows-transfer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt
      - name: Test (Python side)
        run: python -m unittest tests.test_service -v
      - name: Stamp build number
        run: |
          (Get-Content phoneai_transfer/version.py) -replace 'BUILD = 0', "BUILD = $env:GITHUB_RUN_NUMBER" | Set-Content phoneai_transfer/version.py
      - name: Build exe
        run: pyinstaller --noconfirm --onefile --windowed --name PhoneAI互傳 --collect-all tkinterdnd2 --collect-all sv_ttk --hidden-import pystray._win32 run_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneAI互傳-windows
          path: windows-transfer/dist/PhoneAI互傳.exe
      - name: Publish to the windows-latest pre-release (for the in-app update)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub 會去掉檔名裡的中文，所以上傳前改成英文檔名（電腦版 version.py 的 ASSET_NAME 也是這個）
          Copy-Item "dist/PhoneAI互傳.exe" "dist/PhoneAI.exe" -Force
          $tag = "windows-latest"
          $title = "windows-$env:GITHUB_RUN_NUMBER"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --prerelease --title $title --notes "電腦版互傳檔案（自動更新用）" }
          gh release upload $tag dist/PhoneAI.exe --clobber
          gh release edit $tag --title $title --prerelease
