name: Windows transfer

on:
  push:
    branches: [main]
    paths: ["windows-transfer/**"]
  workflow_dispatch:

# 權限預設只讀；發布到 windows-latest 的步驟移到獨立的 release job（才有 contents: write）。
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows-transfer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false   # 建置（會安裝第三方套件）用不到寫入憑證
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt
      - name: Test (Python side)
        run: python -m unittest tests.test_service -v
      - name: Stamp build number
        run: |
          (Get-Content phoneai_transfer/version.py) -replace 'BUILD = 0', "BUILD = $env:GITHUB_RUN_NUMBER" | Set-Content phoneai_transfer/version.py
      - name: Build exe
        run: pyinstaller --noconfirm --onefile --windowed --name PhoneAI互傳 --collect-all tkinterdnd2 --collect-all sv_ttk --hidden-import pystray._win32 run_app.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PhoneAI互傳-windows
          path: windows-transfer/dist/PhoneAI互傳.exe

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write   # 只有發布 job 有寫入權限；建置 job（pip 安裝第三方套件）只讀
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: PhoneAI互傳-windows
          path: windows-transfer/dist
      - name: Publish to the windows-latest pre-release (for the in-app update)
        working-directory: windows-transfer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # GitHub 會去掉檔名裡的中文，所以上傳前改成英文檔名（電腦版 version.py 的 ASSET_NAME 也是這個）
          Copy-Item "dist/PhoneAI互傳.exe" "dist/PhoneAI.exe" -Force
          $tag = "windows-latest"
          $title = "windows-$env:GITHUB_RUN_NUMBER"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --prerelease --title $title --notes "電腦版互傳檔案（自動更新用）" }
          gh release upload $tag dist/PhoneAI.exe --clobber
          gh release edit $tag --title $title --prerelease
