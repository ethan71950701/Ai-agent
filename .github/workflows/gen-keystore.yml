# 一次性：產生專案的 APK 簽名金鑰（只在還沒設定 Secrets 時用）。
# 用法與注意事項見 docs/PUBLISH_CHECKLIST.md「簽名金鑰」。
# 產出放在 Artifact「signing-key」（只有能讀這個 repo 的人拿得到）；**repo 還是私人的時候**做，設好 Secrets 後立刻刪除這個 Artifact 與這次執行紀錄。
name: Generate signing key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Generate keystore
        run: |
          set -euo pipefail
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -keystore phoneai.jks -storetype PKCS12 -alias phoneai -keyalg RSA -keysize 4096 -validity 36500 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=PhoneAI, O=PhoneAI" 2>/dev/null
          mkdir out
          base64 -w0 phoneai.jks > out/KEYSTORE_BASE64.txt
          printf %s "$PASS" > out/KEYSTORE_PASSWORD.txt
          printf %s phoneai > out/KEY_ALIAS.txt
          printf %s "$PASS" > out/KEY_PASSWORD.txt
          echo "::add-mask::$PASS"
      - uses: actions/upload-artifact@v4
        with:
          name: signing-key
          path: out/
          retention-days: 1
